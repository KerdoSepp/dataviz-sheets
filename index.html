<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Class activity</title>
    <link rel="stylesheet" href="./server/style.css">
  </head>
  <body>
    <h1>Class activity</h1>
    <a href="/api/data">View full JSON</a>
    <h2>Daily steps</h2>
    <canvas id="steps" aria-label="Daily steps" role="img"></canvas>
    <h2>Daily total screen time</h2>
    <canvas id="minutes" aria-label="Daily total screen time in minutes" role="img"></canvas>
    <h2>Steps by participant</h2>
    <p>Click a participant’s name in a chart legend to hide or show their line.</p>
    <canvas id="all-steps" aria-label="Daily steps by participant" role="img"></canvas>
    <h2>Screen time by participant</h2>
    <canvas id="all-minutes" aria-label="Daily total screen time in minutes by participant" role="img"></canvas>
    <p id="error" role="alert"></p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
